services:
  jenkins:
    build:
      context: ./jenkins-docker
      dockerfile: Dockerfile
    container_name: swiftkart-jenkins
    user: root
    ports:
      - "${JENKINS_HOST_PORT}:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cicd-net

  sonarqube:
    image: sonarqube:community
    container_name: swiftkart-sonarqube
    ports:
      - "${SONAR_HOST_PORT}:9000"
    environment:
      - SONAR_JDBC_USERNAME=${POSTGRES_USER}
      - SONAR_JDBC_PASSWORD=${POSTGRES_PASSWORD}
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
    depends_on:
      - db
    networks:
      - cicd-net

  db:
    image: postgres:15-alpine
    container_name: swiftkart-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - cicd-net

networks:
  cicd-net:
    driver: bridge

volumes:
  jenkins_home: