# Disable OpenAI auto-configurations so no API key is requested
spring.ai.model.chat=ollama
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.openai.image.enabled=false
spring.ai.openai.moderation.enabled=false

# Ollama local configuration
spring.ai.ollama.base-url=http://localhost:11434
# spring.ai.ollama.chat.options.model=codellama:7b
spring.ai.ollama.chat.options.model=qwen2.5:7b
spring.ai.ollama.chat.options.temperature=0.7


spring.ai.openai.api-key=sk-dummy-key-not-used-by-ollama

demo.key=from_ollama

# Exclude the OpenAI Embedding Auto-Configuration
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration

