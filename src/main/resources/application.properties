spring.application.name=swiftkart-ai-assistant
spring.config.import=optional:file:.env.dev[.properties]


# Import database configuration from application-db.properties
spring.config.import=classpath:application-db.properties


# Local file-backed Spring AI SimpleVectorStore persistence
spring.ai.vectorstore.type=simple
swiftkart.rag.vector-store-path=./data/vectorstore.json

swiftkart.websearch.provider=tavily
swiftkart.websearch.api-key=${TAVILY_API_KEY:}
swiftkart.websearch.search-url=https://api.tavily.com/search


# Ignore incorrect DNS resolutions on MacOS
logging.level.io.netty.resolver.dns.DnsServerAddressStreamProviders=OFF



# Default active profile (can be 'openai' or 'ollama')
spring.profiles.active=ollama

# Ollama
# ./mvnw spring-boot:run -Dspring-boot.run.arguments="--spring.profiles.active=ollama"

# OpenAI
# ./mvnw spring-boot:run -Dspring-boot.run.arguments="--spring.profiles.active=openai"