services:
  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: swiftkart-chromadb-knowledge
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      swiftkart-net:
        aliases:
          - chromadb

  knowledge-service:
    build:
      context: ./knowledge-service
      dockerfile: Dockerfile
    container_name: swiftkart-knowledge-service
    ports:
      - "8082:8082"
    env_file:
      - ./knowledge-service/.env
    environment:
      - PORT=8082
      - CHROMA_HOST=http://chromadb
      - CHROMA_PORT=8000
      - SPRING_AI_VECTORSTORE_CHROMA_INITIALIZE_SCHEMA=true
    depends_on:
      - chromadb
    networks:
      swiftkart-net:
        aliases:
          - knowledge-service

  swiftkart-ai-assistant:
    build:
      context: ./swiftkart-ai-assistant
      dockerfile: Dockerfile
    container_name: swiftkart-ai-assistant
    ports:
      - "8080:8080"
    env_file:
      - ./swiftkart-ai-assistant/.env
    networks:
      swiftkart-net:
        aliases:
          - swiftkart-ai-assistant

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: swiftkart-api-gateway
    ports:
      - "9090:9090"
    env_file:
      - ./api-gateway/.env
    environment:
      - PORT=9090
      - SWIFTKART_URL=http://swiftkart-ai-assistant:8080
      - KNOWLEDGE_SERVICE_URL=http://knowledge-service:8082
    depends_on:
      - swiftkart-ai-assistant
      - knowledge-service
    networks:
      - swiftkart-net

networks:
  swiftkart-net:
    driver: bridge

volumes:
  chroma_data:

