# spring.ai.openai.audio.transcription.enabled=false
# spring.ai.openai.image.enabled=false

spring.config.import=optional:file:.env[.properties]
spring.application.name= swiftkart-ai-assistant
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

# Last N messages retained.
swiftkart.chat.memory-window=10


demo.key=from_openai