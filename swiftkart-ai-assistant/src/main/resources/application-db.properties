
# H2 File-based Persistence
spring.datasource.url=jdbc:h2:file:./data/swiftkart;AUTO_SERVER=TRUE
# spring.datasource.url=jdbc:h2:mem:swiftkart;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Run the idempotent schema.sql on startup without dropping existing conversations.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# Enable H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Enable Spring AI's official auto-initialization for JDBC Chat Memory
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

